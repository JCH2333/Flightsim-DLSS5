# DLSS5 分发服务器 nginx 配置（Alibaba Cloud Linux 3）
# 安装到 /etc/nginx/conf.d/repo.conf 并 systemctl reload nginx
# 说明： listen 8420 —— 裸 IP + 高端口过渡方案（域名备案下发后，此文件再加一个 443 + TLS server 块）

server {
    listen 8420;
    listen [::]:8420;
    server_name _;

    root /srv/repo;

    # 大文件分发：开启 sendfile，关闭 gzip（zip 自身已压缩）
    sendfile on;
    tcp_nopush on;
    gzip off;

    # 断点续传（Range 请求）nginx 原生支持，无需额外配置
    # manifest 变更需要尽快生效，包体基本不变
    add_header Cache-Control "public, max-age=300";

    location / {
        try_files $uri =404;
    }
}
