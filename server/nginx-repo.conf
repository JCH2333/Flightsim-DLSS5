# DLSS5 分发服务器 nginx 配置（Alibaba Cloud Linux 3）
# 安装到 /etc/nginx/conf.d/repo.conf 并 systemctl reload nginx
# 说明： listen 8420 —— 裸 IP + 高端口过渡方案（域名备案下发后，此文件再加一个 443 + TLS server 块）

server {
    listen 8420;
    listen [::]:8420;
    server_name _;

    root /srv;

    # 大文件分发：开启 sendfile，关闭 gzip（zip 自身已压缩）
    sendfile on;
    tcp_nopush on;
    gzip off;

    # 目录请求（如 /repo/dlss5/admin/）解析到 index.html
    index index.html;

    # 断点续传（Range 请求）nginx 原生支持，无需额外配置
    # manifest 变更需要尽快生效，包体基本不变
    add_header Cache-Control "public, max-age=300";

    # 反馈提交 + 站点 API → 本机 python 服务（限流/鉴权在服务内做）
    location /repo/dlss5/feedback {
        proxy_pass http://127.0.0.1:8430;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 48m;
        proxy_read_timeout 120s;
    }

    location /repo/dlss5/api/ {
        proxy_pass http://127.0.0.1:8430;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
        proxy_read_timeout 60s;
    }

    # 加密赞助码信封：python 管理端上传后写缓存文件，nginx 直接静态回（公开只读）
    location = /repo/dlss5/api/assets/sponsor-qr {
        alias /var/lib/dlss5-cms/sponsor-qr.json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
